name: Preveri app-ads
on:
  push:
    branches: [claude/project-thread-wsnfdj]
jobs:
  preveri:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://remako.si/app-ads.txt http://remako.si/app-ads.txt https://www.remako.si/app-ads.txt http://www.remako.si/app-ads.txt https://nakupko.com/app-ads.txt http://nakupko.com/app-ads.txt https://www.nakupko.com/app-ads.txt http://www.nakupko.com/app-ads.txt; do
            echo "===== $u"; curl -sS -m 20 -o body.txt -D - -L -A "Mozilla/5.0 (compatible; Googlebot/2.1)" "$u" | grep -iE "^HTTP|^location|^content-type" ; cat body.txt | head -5; echo
          done
          for id in 6821712043 6818745132; do
            echo "===== itunes $id"; curl -sS "https://itunes.apple.com/lookup?id=$id&country=si" | python3 -c "import sys,json;d=json.load(sys.stdin)['results'];print([(x.get('trackName'),x.get('sellerUrl'),x.get('version')) for x in d])"
          done
          for p in si.nakupko.app si.fixko.app; do
            echo "===== play $p"; curl -sS -L "https://play.google.com/store/apps/details?id=$p&hl=en" | grep -oE 'https?://[a-z0-9.-]*(nakupko|remako|myedge|fixko|popravko)[a-z0-9./-]*' | sort | uniq -c | head -20
          done
