<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aplikacije · REMAKO d.o.o.</title>
  <meta name="description" content="Vse aplikacije podjetja REMAKO d.o.o. na enem mestu: Nakupko, Popravko in Manifest by Urška. Prenesi iz App Store ali Google Play.">
  <meta name="theme-color" content="#07060b">
  <link rel="icon" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #07060b; --ink: #f4f1ff; --muted: #b4adc9; --dim: #7d7694; --line: rgba(255,255,255,.1); --card: rgba(255,255,255,.035); --p: #ec4899; }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 600 18px/1.55 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--ink); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
    header { border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font: 400 20px "Archivo Black", sans-serif; letter-spacing: .04em; text-decoration: none; }
    .logo i { font-style: normal; color: var(--p); }
    .lang { border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 12px; background: none; font: 800 13px "Inter Tight", sans-serif; letter-spacing: .08em; cursor: pointer; color: var(--ink); }
    h1 { font-weight: 900; letter-spacing: -.035em; line-height: 1; font-size: clamp(38px, 6vw, 64px); margin: 56px 0 14px; }
    .lead { color: var(--muted); margin: 0 0 36px; font-size: clamp(18px, 2vw, 21px); }
    .apps { display: grid; gap: 14px; margin-bottom: 60px; }
    .app { display: grid; grid-template-columns: 76px 1fr auto; gap: 20px; align-items: center; padding: 20px; border: 1px solid var(--line); border-radius: 24px; background: var(--card); }
    .app img, .app .mono { width: 76px; height: 76px; border-radius: 18px; display: block; }
    .app .mono { display: grid; place-items: center; font-size: 34px; color: #fcd38a; background: linear-gradient(140deg, #2a1d52, #120c24); border: 1px solid rgba(245,158,11,.35); }
    .app h2 { margin: 0 0 4px; font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
    .app p { margin: 0; color: var(--muted); font-size: 16px; }
    .app .meta { margin-top: 6px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
    .get { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 190px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 15px; padding: 12px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); white-space: nowrap; }
    .btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
    .btn.soon { background: none; color: var(--dim); border: 1px solid var(--line); cursor: default; }
    .more { font-size: 14px; color: var(--dim); text-align: center; text-decoration: none; }
    .more:hover { color: var(--ink); }
    footer { border-top: 1px solid var(--line); padding: 28px 0 44px; color: var(--dim); font-weight: 700; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    footer a { color: var(--dim); text-decoration: none; }
    [data-en] { display: none !important; }
    html[lang="en"] [data-sl] { display: none !important; }
    html[lang="en"] [data-en] { display: revert !important; }
    @media (max-width: 680px) {
      .app { grid-template-columns: 60px 1fr; gap: 14px; padding: 16px; }
      .app img, .app .mono { width: 60px; height: 60px; border-radius: 14px; }
      .app .mono { font-size: 26px; }
      .get { grid-column: 1 / -1; min-width: 0; }
      h1 { margin-top: 36px; }
    }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="logo" href="../">[R]EMAKO<i>.</i></a>
    <button class="lang" id="lang" type="button">EN</button>
  </div></header>

  <main class="wrap">
    <h1><span data-sl>Naše aplikacije</span><span data-en>Our apps</span></h1>
    <p class="lead"><span data-sl>Tapni aplikacijo in odprla se bo v trgovini za tvoj telefon.</span><span data-en>Tap an app and it opens in the store for your phone.</span></p>
    <div class="apps" id="apps"></div>
  </main>

  <div class="wrap"><footer><span>© <span id="y">2026</span> REMAKO d.o.o.</span><span><a href="mailto:support@remako.si">support@remako.si</a> · <a href="../">remako.si</a></span></footer></div>

  <script>
    // Ko aplikacija izide, vpiši povezavo v ios ali android. Prazno = »Kmalu«.
    var APPS = [
      { ime: "Nakupko", ikona: "../img/nakupko.png", vec: "../nakupko/",
        sl: "Nakupovalni seznam, ki se sam odpre, ko stopiš v trgovino. Skupen seznam za vso družino.",
        en: "A shopping list that opens by itself when you walk into a store. One shared list for the whole family.",
        ios: "https://apps.apple.com/si/app/nakupko-shopping-list/id6818745132", android: "" },
      { ime: "Popravko", ikona: "../popravko/logo.png", vec: "../popravko/",
        sl: "Slikaj, kaj je treba popraviti, in preverjeni mojstri v bližini se javijo s terminom. Za stranke brezplačno.",
        en: "Snap what needs fixing and verified tradespeople nearby reply with a time. Free for customers.",
        meta_sl: "Samo v Sloveniji", meta_en: "Slovenia only", ios: "", android: "" },
      { ime: "Manifest by Urška", ikona: "", vec: "",
        sl: "Tri minute na dan: kartica z afirmacijo vsako jutro, vprašanje vsak večer in lunini rituali.",
        en: "Three minutes a day: an affirmation card every morning, a question every evening and moon rituals.",
        meta_sl: "Samo iPhone", meta_en: "iPhone only", ios: "", android: null }
    ];

    var ua = navigator.userAgent || "";
    var naprava = /android/i.test(ua) ? "android" : (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) ? "ios" : "oboje";
    var APPLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1-2.8-4.2zM14 5.1c.7-.9 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>';
    var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8c-.3.3-.4.7-.4 1.2v18c0 .5.1.9.4 1.2l10-10.2-10-10.2zm11.1 9.1 2.8-2.9L5.3 1.1c-.4-.2-.8-.3-1.1-.2l10.5 10zm0 2.2L4.2 23.1c.3.1.7 0 1.1-.2l12.2-6.9-2.8-2.9zm6.1-3.3-2.6-1.5-3 3.1 3 3.1 2.6-1.5c.9-.5.9-1.7 0-2.2z"/></svg>';

    function gumb(trg, url) {
      var ikona = trg === "ios" ? APPLE : PLAY, ime = trg === "ios" ? "App Store" : "Google Play";
      if (url) return '<a class="btn" href="' + url + '">' + ikona + '<span data-sl>Prenesi · ' + ime + '</span><span data-en>Get it · ' + ime + '</span></a>';
      return '<span class="btn soon">' + ikona + '<span data-sl>Kmalu · ' + ime + '</span><span data-en>Coming soon · ' + ime + '</span></span>';
    }

    document.getElementById("apps").innerHTML = APPS.map(function (a) {
      var trgi = naprava === "oboje" ? ["ios", "android"] : [naprava];
      trgi = trgi.filter(function (t) { return a[t] !== null; });
      if (!trgi.length) trgi = ["ios"]; // npr. Manifest na Androidu: pokaži, da je za iPhone
      var cilj = trgi.map(function (t) { return a[t]; }).filter(Boolean)[0];
      var ikona = a.ikona ? '<img src="' + a.ikona + '" alt="" width="76" height="76">' : '<div class="mono" aria-hidden="true">✦</div>';
      if (cilj) ikona = '<a href="' + cilj + '" aria-label="' + a.ime + '">' + ikona + '</a>';
      var meta = a.meta_sl ? '<div class="meta"><span data-sl>' + a.meta_sl + '</span><span data-en>' + a.meta_en + '</span></div>' : "";
      return '<article class="app">' + ikona +
        '<div><h2>' + a.ime + '</h2><p data-sl>' + a.sl + '</p><p data-en>' + a.en + '</p>' + meta + '</div>' +
        '<div class="get">' + trgi.map(function (t) { return gumb(t, a[t]); }).join("") +
        (a.vec ? '<a class="more" href="' + a.vec + '"><span data-sl>Več o aplikaciji</span><span data-en>More about the app</span></a>' : "") +
        '</div></article>';
    }).join("");

    (function () {
      var root = document.documentElement, btn = document.getElementById("lang"), saved = null;
      try { saved = localStorage.getItem("remako-lang"); } catch (e) {}
      function set(l) { root.lang = l; btn.textContent = l === "sl" ? "EN" : "SL"; try { localStorage.setItem("remako-lang", l); } catch (e) {} }
      set(saved || ((navigator.language || "sl").slice(0, 2) === "sl" ? "sl" : "en"));
      btn.onclick = function () { set(root.lang === "sl" ? "en" : "sl"); };
      document.getElementById("y").textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
