<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aplikacije · REMAKO d.o.o.</title>
  <meta name="description" content="Vse aplikacije podjetja REMAKO d.o.o. na enem mestu: Nakupko, Popravko in Manifest by Urška. Prenesi iz App Store ali Google Play.">
  <meta name="theme-color" content="#05040a">
  <link rel="icon" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05040a; --ink: #f4f1ff; --muted: #b4adc9; --dim: #7d7694; --line: rgba(255,255,255,.1); --p: #ec4899; }
    * { box-sizing: border-box; }
    html { background: var(--bg); overflow-x: clip; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 600 18px/1.55 "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; min-height: 100vh; }
    a { color: var(--ink); }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 2; }

    /* Ozadje: zvezde in mreža tal */
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .floor { position: fixed; left: -50%; right: -50%; bottom: -10vh; height: 60vh; z-index: 1; pointer-events: none;
      background-image: linear-gradient(rgba(139,92,246,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(139,92,246,.22) 1px, transparent 1px);
      background-size: 64px 64px; transform: perspective(500px) rotateX(68deg); transform-origin: 50% 100%;
      -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 85%); mask-image: linear-gradient(to top, #000 10%, transparent 85%);
      animation: floor 6s linear infinite; }
    @keyframes floor { to { background-position: 0 64px, 0 0; } }

    header { position: relative; z-index: 3; border-bottom: 1px solid var(--line); background: rgba(5,4,10,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font: 400 20px "Archivo Black", sans-serif; letter-spacing: .04em; text-decoration: none; }
    .logo i { font-style: normal; color: var(--p); }
    .hbtns { display: flex; gap: 10px; }
    .lang, .replay { border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 6px 12px; background: none; font: 800 13px "Inter Tight", sans-serif; letter-spacing: .08em; cursor: pointer; color: var(--ink); }

    .top { text-align: center; padding: clamp(40px, 8vh, 90px) 0 10px; }
    .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: #8be9fd; margin: 0 0 14px; text-shadow: 0 0 12px rgba(139,233,253,.6); }
    h1 { font-weight: 900; letter-spacing: -.035em; line-height: .98; font-size: clamp(42px, 7vw, 92px); margin: 0 0 16px;
      background: linear-gradient(95deg, #a78bfa, #8be9fd 40%, var(--p) 75%, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { color: var(--muted); margin: 0 auto; max-width: 620px; font-size: clamp(17px, 1.8vw, 21px); }

    /* Hologrami */
    .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(18px, 3vw, 40px); padding: clamp(30px, 6vh, 70px) 0 90px; }
    .holo { --c: 167,139,250; position: relative; text-align: center; perspective: 900px; opacity: 0; }
    .ready .holo { animation: materialize 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * .22s); }
    @keyframes materialize {
      0% { opacity: 0; filter: blur(14px) brightness(2); clip-path: inset(100% 0 0 0); }
      60% { opacity: 1; filter: blur(2px) brightness(1.4); clip-path: inset(0 0 0 0); }
      100% { opacity: 1; filter: none; clip-path: inset(0 0 0 0); } }
    .stage { position: relative; height: 290px; transform-style: preserve-3d; transition: transform .25s ease-out; }
    .proj { position: absolute; left: 50%; bottom: 0; width: 190px; height: 40px; transform: translateX(-50%); border-radius: 50%;
      background: radial-gradient(ellipse, rgba(var(--c),.55), rgba(var(--c),.08) 60%, transparent 72%);
      box-shadow: 0 0 40px rgba(var(--c),.35); }
    .proj::before, .proj::after { content: ""; position: absolute; inset: 6px 22px; border-radius: 50%; border: 1px solid rgba(var(--c),.7); animation: ring 3s ease-out infinite; }
    .proj::after { animation-delay: 1.5s; }
    @keyframes ring { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
    .beam { position: absolute; left: 50%; bottom: 18px; width: 240px; height: 205px; transform: translateX(-50%);
      clip-path: polygon(36% 100%, 64% 100%, 100% 0, 0 0);
      background: linear-gradient(to top, rgba(var(--c),.42), rgba(var(--c),.05) 75%, transparent 92%);
      animation: beam 4s ease-in-out infinite; pointer-events: none; }
    .beam::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(255,255,255,.05) 9px 10px); -webkit-mask-image: linear-gradient(to top, #000, transparent 75%); mask-image: linear-gradient(to top, #000, transparent 75%); }
    @keyframes beam { 0%, 100% { opacity: .85; } 50% { opacity: .55; } 91% { opacity: .85; } 92% { opacity: .25; } 93% { opacity: .9; } }
    .float { position: absolute; left: 50%; top: 22px; width: 150px; height: 150px; margin-left: -75px; animation: float 5s ease-in-out infinite; transform-style: preserve-3d; }
    @keyframes float { 0%, 100% { transform: translateY(0) rotateY(-10deg); } 50% { transform: translateY(-14px) rotateY(10deg); } }
    .icon { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden; opacity: .84;
      filter: drop-shadow(-3px 0 0 rgba(255,40,120,.55)) drop-shadow(3px 0 0 rgba(0,220,255,.55)) drop-shadow(0 0 26px rgba(var(--c),.8));
      animation: glitch 7s steps(1) infinite; }
    .icon img { width: 100%; height: 100%; display: block; }
    .icon .glyph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 84px; color: #fff3c4; background: radial-gradient(circle at 50% 40%, rgba(var(--c),.55), rgba(42,29,82,.9) 70%); }
    .icon::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(var(--c),.6), rgba(139,233,253,.35)); mix-blend-mode: color; }
    .icon::after { content: ""; position: absolute; inset: -40% 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.16) 0 2px, transparent 2px 5px); mix-blend-mode: overlay; animation: scan 2.4s linear infinite; }
    @keyframes scan { to { transform: translateY(20%); } }
    @keyframes glitch { 0%, 89%, 100% { transform: none; opacity: .84; } 90% { transform: translateX(-6px) skewX(8deg); opacity: .6; } 91% { transform: translateX(5px); opacity: .95; } 92% { transform: none; opacity: .4; } 93% { opacity: .84; } }
    .shine { position: absolute; inset: 0; border-radius: 34px; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 62%); background-size: 250% 100%; animation: shine 4.5s ease-in-out infinite; mix-blend-mode: screen; }
    @keyframes shine { 0% { background-position: 130% 0; } 60%, 100% { background-position: -60% 0; } }
    .reflect { position: absolute; left: 50%; bottom: -26px; width: 150px; height: 40px; margin-left: -75px; border-radius: 50%; background: radial-gradient(ellipse, rgba(var(--c),.3), transparent 70%); filter: blur(6px); }

    .info { position: relative; margin-top: 30px; padding: 22px 20px 20px; border: 1px solid rgba(var(--c),.28); border-radius: 22px;
      background: linear-gradient(180deg, rgba(var(--c),.1), rgba(10,8,18,.85)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .info::before { content: ""; position: absolute; left: 20%; right: 20%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(var(--c),1), transparent); }
    .info h2 { margin: 0 0 6px; font-size: 26px; font-weight: 900; letter-spacing: -.02em; text-shadow: 0 0 18px rgba(var(--c),.55); }
    .info p { margin: 0 0 6px; color: var(--muted); font-size: 16px; min-height: 3.1em; }
    .meta { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--c)); margin-bottom: 14px; min-height: 1.2em; }
    .get { display: grid; gap: 8px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 15px; padding: 13px 18px; border-radius: 999px; background: var(--ink); color: #05040a; white-space: nowrap; box-shadow: 0 0 24px rgba(var(--c),.45); transition: transform .15s, box-shadow .15s; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(var(--c),.7); }
    .btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
    .btn.soon { background: none; color: var(--dim); border: 1px dashed rgba(var(--c),.35); box-shadow: none; cursor: default; }
    .more { font-size: 14px; color: var(--dim); text-decoration: none; margin-top: 4px; display: inline-block; }
    .more:hover { color: var(--ink); }

    footer { position: relative; z-index: 2; border-top: 1px solid var(--line); padding: 28px 0 44px; color: var(--dim); font-weight: 700; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    footer a { color: var(--dim); text-decoration: none; }

    /* Uvod */
    #intro { position: fixed; inset: 0; z-index: 50; background: #05040a; display: grid; place-items: center; transition: opacity .8s ease, visibility .8s; }
    #intro.out { opacity: 0; visibility: hidden; }
    #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #intro .scanline { position: absolute; left: 0; right: 0; height: 2px; top: -4px; background: linear-gradient(90deg, transparent, #8be9fd, #fff, #8be9fd, transparent); box-shadow: 0 0 24px #8be9fd, 0 0 60px rgba(139,233,253,.6); opacity: 0; }
    #intro.scan .scanline { animation: sweep 1s cubic-bezier(.6,0,.4,1) forwards; }
    @keyframes sweep { 0% { top: -4px; opacity: 1; } 100% { top: 100%; opacity: 1; } }
    #intro .skip { position: absolute; right: 16px; bottom: 20px; z-index: 2; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; background: none; color: var(--muted); font: 800 13px "Inter Tight", sans-serif; letter-spacing: .08em; padding: 8px 14px; cursor: pointer; }
    #intro .cap { position: absolute; bottom: 22%; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .4em; text-transform: uppercase; color: #8be9fd; opacity: 0; transition: opacity .6s; text-shadow: 0 0 12px rgba(139,233,253,.7); }
    #intro.cap-on .cap { opacity: 1; }

    [data-en] { display: none !important; }
    html[lang="en"] [data-sl] { display: none !important; }
    html[lang="en"] [data-en] { display: revert !important; }
    @media (max-width: 900px) {
      .apps { grid-template-columns: 1fr; max-width: 440px; margin: 0 auto; gap: 30px; }
      .stage { height: 250px; }
      .float { width: 130px; height: 130px; margin-left: -65px; }
      .icon, .shine { border-radius: 30px; }
      .info p { min-height: 0; }
      .meta { min-height: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .holo { opacity: 1; }
      #intro { display: none; }
    }
  </style>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <canvas id="introCv"></canvas>
    <div class="scanline"></div>
    <div class="cap"><span data-sl>Projekcija aplikacij</span><span data-en>Projecting apps</span></div>
    <button class="skip" id="skip" type="button"><span data-sl>Preskoči ›</span><span data-en>Skip ›</span></button>
  </div>

  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="floor" aria-hidden="true"></div>

  <header><div class="wrap">
    <a class="logo" href="../">[R]EMAKO<i>.</i></a>
    <div class="hbtns">
      <button class="replay" id="replay" type="button" aria-label="Ponovi uvod">↺</button>
      <button class="lang" id="lang" type="button">EN</button>
    </div>
  </div></header>

  <main class="wrap">
    <div class="top">
      <p class="eyebrow">REMAKO · App Hub</p>
      <h1><span data-sl>Naše aplikacije</span><span data-en>Our apps</span></h1>
      <p class="lead"><span data-sl>Tapni aplikacijo in odprla se bo v trgovini za tvoj telefon.</span><span data-en>Tap an app and it opens in the store for your phone.</span></p>
    </div>
    <div class="apps" id="apps"></div>
  </main>

  <div class="wrap"><footer><span>© <span id="y">2026</span> REMAKO d.o.o.</span><span><a href="mailto:support@remako.si">support@remako.si</a> · <a href="../">remako.si</a></span></footer></div>

  <script>
    // Ko aplikacija izide, vpiši povezavo v ios ali android. Prazno = »Kmalu«, null = platforme ni.
    var APPS = [
      { ime: "Nakupko", ikona: "../img/nakupko.png", vec: "../nakupko/", barva: "167,139,250",
        sl: "Nakupovalni seznam, ki se sam odpre, ko stopiš v trgovino. Skupen seznam za vso družino.",
        en: "A shopping list that opens by itself when you walk into a store. One shared list for the whole family.",
        ios: "https://apps.apple.com/si/app/nakupko-shopping-list/id6818745132", android: "" },
      { ime: "Popravko", ikona: "../popravko/logo.png", vec: "../popravko/", barva: "127,209,181",
        sl: "Slikaj, kaj je treba popraviti, in preverjeni mojstri v bližini se javijo s terminom.",
        en: "Snap what needs fixing and verified tradespeople nearby reply with a time.",
        meta_sl: "Samo v Sloveniji", meta_en: "Slovenia only", ios: "", android: "" },
      { ime: "Manifest by Urška", ikona: "", vec: "", barva: "252,211,138",
        sl: "Tri minute na dan: kartica z afirmacijo vsako jutro, vprašanje vsak večer in lunini rituali.",
        en: "Three minutes a day: an affirmation card every morning, a question every evening and moon rituals.",
        meta_sl: "Samo iPhone", meta_en: "iPhone only", ios: "", android: null }
    ];

    var ua = navigator.userAgent || "";
    var naprava = /android/i.test(ua) ? "android" : (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) ? "ios" : "oboje";
    var APPLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1-2.8-4.2zM14 5.1c.7-.9 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>';
    var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8c-.3.3-.4.7-.4 1.2v18c0 .5.1.9.4 1.2l10-10.2-10-10.2zm11.1 9.1 2.8-2.9L5.3 1.1c-.4-.2-.8-.3-1.1-.2l10.5 10zm0 2.2L4.2 23.1c.3.1.7 0 1.1-.2l12.2-6.9-2.8-2.9zm6.1-3.3-2.6-1.5-3 3.1 3 3.1 2.6-1.5c.9-.5.9-1.7 0-2.2z"/></svg>';

    function gumb(trg, url) {
      var ikona = trg === "ios" ? APPLE : PLAY, ime = trg === "ios" ? "App Store" : "Google Play";
      if (url) return '<a class="btn" href="' + url + '">' + ikona + '<span data-sl>Prenesi · ' + ime + '</span><span data-en>Get it · ' + ime + '</span></a>';
      return '<span class="btn soon">' + ikona + '<span data-sl>Kmalu · ' + ime + '</span><span data-en>Coming soon · ' + ime + '</span></span>';
    }

    document.getElementById("apps").innerHTML = APPS.map(function (a, i) {
      var trgi = naprava === "oboje" ? ["ios", "android"] : [naprava];
      trgi = trgi.filter(function (t) { return a[t] !== null; });
      if (!trgi.length) trgi = ["ios"];
      var cilj = trgi.map(function (t) { return a[t]; }).filter(Boolean)[0];
      var slika = a.ikona ? '<img src="' + a.ikona + '" alt="">' : '<div class="glyph">✦</div>';
      var holo = '<div class="stage"><div class="beam"></div><div class="proj"></div><div class="reflect"></div>' +
        '<div class="float"><div class="icon">' + slika + '</div><div class="shine"></div></div></div>';
      if (cilj) holo = '<a href="' + cilj + '" aria-label="' + a.ime + '" style="text-decoration:none;display:block">' + holo + '</a>';
      var meta = '<div class="meta">' + (a.meta_sl ? '<span data-sl>' + a.meta_sl + '</span><span data-en>' + a.meta_en + '</span>' : '') + '</div>';
      return '<article class="holo" style="--c:' + a.barva + ';--i:' + i + '">' + holo +
        '<div class="info"><h2>' + a.ime + '</h2><p data-sl>' + a.sl + '</p><p data-en>' + a.en + '</p>' + meta +
        '<div class="get">' + trgi.map(function (t) { return gumb(t, a[t]); }).join("") + '</div>' +
        (a.vec ? '<a class="more" href="' + a.vec + '"><span data-sl>Več o aplikaciji →</span><span data-en>More about the app →</span></a>' : "") +
        '</div></article>';
    }).join("");

    // Nagib holograma za miško ali prst
    document.querySelectorAll(".holo").forEach(function (h) {
      var st = h.querySelector(".stage");
      h.addEventListener("pointermove", function (e) {
        var r = st.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        st.style.transform = "rotateY(" + (x * 22) + "deg) rotateX(" + (-y * 14) + "deg)";
      });
      h.addEventListener("pointerleave", function () { st.style.transform = ""; });
    });

    // Zvezde v ozadju
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    (function () {
      var cv = document.getElementById("sky"), x = cv.getContext("2d"), st = [], w, h, dpr = Math.min(window.devicePixelRatio || 1, 2);
      function size() { w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
        st = []; for (var i = 0; i < Math.round(w * h / 9000); i++) st.push({ x: Math.random() * w, y: Math.random() * h * .75, r: Math.random() * 1.2 + .2, t: Math.random() * 6 }); }
      function draw(t) { x.clearRect(0, 0, w, h);
        for (var i = 0; i < st.length; i++) { var s = st[i], a = .25 + .35 * Math.sin(t / 900 + s.t); x.fillStyle = "rgba(220,215,255," + a + ")"; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fill(); }
        if (!reduce) requestAnimationFrame(draw); }
      size(); addEventListener("resize", size); requestAnimationFrame(draw);
    })();

    // Uvod: delci se zberejo v napis, svetlobni pas ga prebere, nato se odpre hub
    var intro = document.getElementById("intro"), body = document.body, tekoci = 0;
    function pokazi() { intro.classList.add("out"); setTimeout(function () { body.classList.add("ready"); }, 250); tekoci++; }
    function uvod() {
      var moj = ++tekoci;
      body.classList.remove("ready"); intro.classList.remove("out", "scan", "cap-on");
      var cv = document.getElementById("introCv"), x = cv.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = innerWidth, h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
      // cilji iz besedila
      var off = document.createElement("canvas"), o = off.getContext("2d"); off.width = w; off.height = h;
      var fs = w < 600 ? w / 3.4 : Math.min(w / 5.2, 190); o.fillStyle = "#fff"; o.textAlign = "center"; o.textBaseline = "middle";
      o.font = "900 " + fs + "px 'Inter Tight', system-ui, sans-serif"; o.fillText("APPS", w / 2, h / 2 - fs * .1);
      o.font = "400 " + (fs * .26) + "px 'Archivo Black', sans-serif"; o.fillText("[R]EMAKO", w / 2, h / 2 + fs * .62);
      var d = o.getImageData(0, 0, w, h).data, pts = [], step = w < 600 ? 3 : 5;
      for (var yy = 0; yy < h; yy += step) for (var xx = 0; xx < w; xx += step) if (d[(yy * w + xx) * 4 + 3] > 128) pts.push([xx, yy]);
      var cols = ["167,139,250", "139,233,253", "236,72,153", "245,158,11"];
      var P = pts.map(function (p) { var a = Math.random() * 6.283, r = Math.max(w, h) * (.6 + Math.random() * .6);
        return { tx: p[0], ty: p[1], x: w / 2 + Math.cos(a) * r, y: h / 2 + Math.sin(a) * r, c: cols[Math.floor(p[0] / w * 4) % 4], dl: Math.random() * .35 }; });
      var t0 = performance.now();
      function frame(now) {
        if (moj !== tekoci) return;
        var t = (now - t0) / 1000; x.fillStyle = "rgba(5,4,10,.32)"; x.fillRect(0, 0, w, h);
        for (var i = 0; i < P.length; i++) { var p = P[i], k = Math.min(1, Math.max(0, (t - p.dl) / 1.4)); k = 1 - Math.pow(1 - k, 3);
          var jx = t > 2 ? (Math.random() - .5) * 2 : 0, px = p.x + (p.tx - p.x) * k + jx, py = p.y + (p.ty - p.y) * k;
          x.fillStyle = "rgba(" + p.c + "," + (.35 + .65 * k) + ")"; x.fillRect(px, py, step * .7, step * .7); }
        if (t > 1.7 && !intro.classList.contains("scan")) { intro.classList.add("scan", "cap-on"); }
        if (t > 3.0) { pokazi(); return; }
        requestAnimationFrame(frame);
      }
      x.fillStyle = "#05040a"; x.fillRect(0, 0, w, h); requestAnimationFrame(frame);
    }
    document.getElementById("skip").onclick = pokazi;
